<div class="row" *ngIf="hasPageAccess">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink=".">Etat du Stock</a></li>
    </ol>
  </nav>

  <div class="col-md-12 grid-margin stretch-card">
    <div class="card shadow-sm">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h4 class="card-title mb-0">Etat du Stock</h4>
          <p class="text-muted small">Visualisation et correction du stock en temps réel</p>
        </div>
        <div class="d-flex gap-2">
          <button type="button" *ngIf="canExportEtatStock" class="btn btn-outline-primary" (click)="downloadEtatStock()">
            <i class="feather icon-printer me-1"></i> Imprimer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row" *ngIf="hasPageAccess">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <div class="row mb-3 align-items-center">
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="Rechercher un article..." (keyup)="updateFilter($event)" />
          </div>
          <div class="col-md-4">
            <ng-select [items]="categories" bindLabel="libelle_categorie_article" bindValue="id"
              placeholder="Toutes les catégories" [(ngModel)]="selectedCategoryId" (change)="filterByCategory($event)">
            </ng-select>
          </div>
        </div>

        <div class="table-responsive">
          <ngx-datatable #table class="bootstrap" [rows]="rows" [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force" [footerHeight]="50" [limit]="10" rowHeight="auto" [scrollbarH]="true">
            
            <ngx-datatable-column name="Code" prop="code_article" [width]="100"></ngx-datatable-column>
            <ngx-datatable-column name="Articles" prop="libelle" [width]="250"></ngx-datatable-column>
            
            <ngx-datatable-column name="Catégorie">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ getCategoryName(row.id_cat) || 'N/A' }}
              </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Qte Actuelle" [width]="120">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <span [ngClass]="(row.stock?.Qte_actuel || 0) <= row.stock_alerte ? 'badge bg-danger' : 'badge bg-success'"
                      style="font-size: 0.9rem; padding: 0.6em 0.8em;">
                  {{ row.stock?.Qte_actuel || 0 }}
                </span>
              </ng-template>
            </ngx-datatable-column>

            <!-- NOUVELLE COLONNE ACTIONS -->
            <!-- <ngx-datatable-column name="Actions" [sortable]="false">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <button class="btn btn-sm btn-outline-warning" title="Corriger le stock" (click)="openCorrectionModal(correctionModal, row)">
                  <i class="feather icon-edit-3"></i> Correction
                </button>
              </ng-template>
            </ngx-datatable-column> -->

          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>
