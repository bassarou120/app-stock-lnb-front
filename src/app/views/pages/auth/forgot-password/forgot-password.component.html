<div class="container">
  <div class="row w-100 mx-0 auth-page">
    <div class="col-md-8 col-xl-6 mx-auto">
      <div class="card">
        <div class="row">
          <div class="col-md-4 pe-md-0">
            <div class="auth-side-wrapper" [ngStyle]="{ 'background-image': 'url(images/img_login.png)' }">
            </div>
          </div>
          <div class="col-md-8 ps-md-0">
            <div class="auth-form-wrapper px-4 py-5">
              <a routerLink="." class="nobleui-logo d-block mb-2">Récupération de mot de passe<span> </span></a>

              <!-- <img src="images/logo.png" alt="logo" class="mb-3" width="200"> -->
              <br>

              <h5 class="text-secondary fw-normal mb-4">Veuillez entrer l’adresse email associée à votre compte</h5>
              <form class="forms-sample" [formGroup]="forgotPasswordForm" (ngSubmit)="onSendOTP()">
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Email </label>
                  <input type="email" class="form-control" id="exampleInputEmail1" placeholder="email@gmail.com"
                    formControlName="email"
                    [class.invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
                  <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
                    <small *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
                      class="text-danger"> *l'email est obligatoire</small>
                  </div>
                </div>

                <div class="mb-2">
                  <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0">Suivant
                    <div class="spinner-border spinner-border-sm text-light d-none" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </button>
                </div>
                <a routerLink="/auth/login" class="d-block mt-3 text-secondary">Se Connecter</a>
                <!-- <a routerLink="/auth/reset-password" class="d-block mt-3 text-secondary">reset-password</a> -->
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
