<div class="container">
  <div class="row w-100 mx-0 auth-page">
    <div class="col-md-8 col-xl-6 mx-auto">
      <div class="card">
        <div class="row">
          <div class="col-md-4 pe-md-0">
            <div class="auth-side-wrapper" [ngStyle]="{ 'background-image': 'url(images/img_login.png)' }">
            </div>
          </div>
          <div class="col-md-8 ps-md-0">
            <div class="auth-form-wrapper px-4 py-5">
              <a routerLink="." class="nobleui-logo d-block mb-2">Récupération de mot de passe<span> </span></a>

              <!-- <img src="images/logo.png" alt="logo" class="mb-3" width="200"> -->
              <br>

              <h5 class="text-secondary fw-normal mb-4">Veuillez entrer votre nouveau mot de passe</h5>
              <form class="forms-sample" [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
                <div class="mb-3">
                  <label for="exampleInputPassword1" class="form-label">Mot de passe</label>
                  <input type="text" class="form-control" id="exampleInputPassword1" autocomplete="current-password"
                    placeholder="Mot de passe" formControlName="password"
                    [class.invalid]="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched">
                  <div *ngIf="resetPasswordForm.get('password')?.touched">
                    <small *ngIf="resetPasswordForm.get('password')?.errors?.['required']" class="text-danger">
                      *le mot de passe est obligatoire
                    </small>
                    <small *ngIf="resetPasswordForm.get('password')?.errors?.['minlength']" class="text-danger">
                      *le mot de passe doit contenir au moins 8 caractères
                    </small>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="exampleInputCPassword1" class="form-label">Confirmez le Mot de passe</label>
                  <input type="password" class="form-control" id="exampleInputCPassword1" autocomplete=""
                    placeholder="Confirmez le Mot de passe" formControlName="password_confirmation"
                    [class.invalid]="resetPasswordForm.get('password_confirmation')?.invalid && resetPasswordForm.get('password_confirmation')?.touched">
                  <div *ngIf="resetPasswordForm.get('password_confirmation')?.touched">
                    <small *ngIf="resetPasswordForm.get('password_confirmation')?.errors?.['required']" class="text-danger">
                      *le mot de passe est obligatoire
                    </small>
                    <small *ngIf="resetPasswordForm.get('password_confirmation')?.errors?.['minlength']" class="text-danger">
                      *le mot de passe doit contenir au moins 8 caractères
                    </small>
                  </div>
                </div>

                <div class="mb-2">
                  <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0">Modifier
                    <div class="spinner-border spinner-border-sm text-light d-none" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </button>
                </div>
                <!-- <a routerLink="/auth/login" class="d-block mt-3 text-secondary">Se Connecter</a> -->
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
