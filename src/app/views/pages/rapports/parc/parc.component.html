<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex justify-content-between">
        <div>
          <h4 class="card-title">Rapport Parc</h4>
          <p class="text-secondary">Rapport Parc</p>
        </div>
        <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-primary btn-icon-text align-self-center" (click)="downloadEtatStock()">
          <i class="btn-icon-prepend" data-feather="printer" appFeatherIcon></i>
          Imprimer
        </button>
      </div>
      </div>
    </div>
  </div>
</div>


<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Rapport Parc</h6>
        <div class="row mb-3 d-flex justify-content-between">
          <div class="col-xl-3 col-md-4">
            <input type="text" class="form-control form-control-sm" placeholder="Rechercher..."
              (keyup)="updateFilter($event)" />
          </div>
          <div class="col-xl-3 col-md-4 ml-2">
            <ng-select
              [items]="categories"
              bindLabel="libelle_categorie_article"
              bindValue="id"
              placeholder="Toutes les catégories"
              clearable="true"
              (change)="filterByCategory($event)"
              [(ngModel)]="selectedCategoryId">
            </ng-select>
          </div>
        </div>
        <div class="table-responsive">
          <ngx-datatable #table class="bootstrap" [rows]="rows" [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force" [footerHeight]="50" [limit]="10" rowHeight="auto" [scrollbarH]="true">
            <!-- <ngx-datatable-column name="ID" prop="id"></ngx-datatable-column> -->
            <ngx-datatable-column name="N°">
              <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
                {{ rowIndex + 1 }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Code" prop="code_article"></ngx-datatable-column>
            <ngx-datatable-column name="Articles" prop="libelle"></ngx-datatable-column>
            <ngx-datatable-column name="Catégorie">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ getCategoryName(row.id_cat) || 'N/A' }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Qte Actuelle">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <div

                  [ngStyle]="{
                    'background-color': (row.stock?.Qte_actuel || 0) <= row.stock_alerte ? '#ff3366' : '#198754'
                  }" class="text-white p-1 rounded d-inline-block"
                        style="min-width: 50px; text-align: center;">
                  {{ row.stock?.Qte_actuel || 0 }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Stock d'alerte" prop="stock_alerte"></ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>
