<div class="main-wrapper">
  <div class="page-wrapper full-page">
    <div class="page-content container-xxl d-flex align-items-center justify-content-center">

      <div class="row w-100 mx-0 auth-page">
        <div class="col-md-8 col-xl-6 mx-auto d-flex flex-column align-items-center">
          <!-- 🔥 Image conditionnelle selon le type d'erreur -->
          <img [src]="type === '403' ? 'images/others/403.svg' : 'images/others/404.svg'" 
               class="img-fluid mb-2" [alt]="type">
          <h1 class="fw-bolder mb-22 mt-2 tx-80 text-secondary">{{type}}</h1>
          <h4 class="mb-2">{{title}}</h4>
          <h6 class="text-secondary mb-3 text-center" [innerHTML]="desc"></h6>
          <a routerLink="">Retour à l'accueil</a>
        </div>
      </div>

    </div>
  </div>
</div>
